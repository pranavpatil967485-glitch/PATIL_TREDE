<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PATIL_TREDE</title>

<style>
body{
 margin:0;
 background:#080d18;
 color:white;
 font-family:Arial,sans-serif;
}
header{
 background:#111a2b;
 padding:20px;
 text-align:center;
}
h1{color:#00d9a0}
main{padding:15px}
.card{
 background:#131e30;
 border:1px solid #263750;
 border-radius:12px;
 padding:15px;
 margin-bottom:15px;
}
.chart{
 width:100%;
 height:450px;
 border:0;
 border-radius:8px;
}
.status{color:#00d9a0}
button{
 background:#00b88a;
 padding:12px 18px;
 border:0;
 border-radius:8px;
}
</style>
</head>

<body>

<header>
<h1>PATIL_TREDE</h1>
<p>Market Learning Dashboard</p>
</header>

<main>

<div class="card">
<h2>Dashboard</h2>
<p class="status">● Online</p>
</div>
<div class="card">
<h2>📊 Live Market Watchlist</h2>

<div class="tradingview-widget-container">
<div class="tradingview-widget-container__widget"></div>

<script
type="text/javascript"
src="https://s3.tradingview.com/external-embedding/embed-widget-tickers.js"
async>
{
  "symbols": [
    {"proName":"BINANCE:BTCUSDT","title":"Bitcoin"},
    {"proName":"BINANCE:ETHUSDT","title":"Ethereum"},
    {"proName":"BINANCE:SOLUSDT","title":"Solana"}
  ],
  "colorTheme":"dark",
  "isTransparent":false,
  "locale":"en"
}
</script>
</div>
</div>
<div class="card">
<h2>Bitcoin Chart</h2>
<div class="card">
<h2>Bitcoin (BTC/USDT)</h2>
<iframe class="chart"
src="https://s.tradingview.com/widgetembed/?symbol=BINANCE%3ABTCUSDT&interval=15&theme=dark&style=1&timezone=Asia%2FKolkata"
></iframe>
</div>

<div class="card">
<h2>Ethereum (ETH/USDT)</h2>
<iframe class="chart"
src="https://s.tradingview.com/widgetembed/?symbol=BINANCE%3AETHUSDT&interval=15&theme=dark&style=1&timezone=Asia%2FKolkata"
></iframe>
</div>

<div class="card">
<h2>Solana (SOL/USDT)</h2>
<iframe class="chart"
src="https://s.tradingview.com/widgetembed/?symbol=BINANCE%3ASOLUSDT&interval=15&theme=dark&style=1&timezone=Asia%2FKolkata"
></iframe>
</div>
<iframe
class="chart"
src="https://s.tradingview.com/widgetembed/?symbol=BINANCE%3ABTCUSDT&interval=15&theme=dark&style=1&timezone=Asia%2FKolkata&withdateranges=true&hide_side_toolbar=false&allow_symbol_change=true"
loading="lazy"
allowfullscreen>
</iframe>

</div>

<div class="card">
<h2>Broker Information</h2>
<p>Connection Status: Not Connected</p>
</div>

<div class="card">
<h2>Demo Dashboard</h2>
<p>Simulation Only</p>
</div>

<div class="card">
<h2>Contact Support</h2>
<button onclick="alert('PATIL_TREDE Support')">
Contact Support
</button>
</div>

</main>
</body>
</html>
