<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PATIL_TREDE</title>

<style>
body{
 margin:0;
 background:#080d18;
 color:white;
 font-family:Arial,sans-serif;
}
header{
 background:#111a2b;
 padding:20px;
 text-align:center;
}
h1{color:#00d9a0}
main{padding:15px}
.card{
 background:#131e30;
 border:1px solid #263750;
 border-radius:12px;
 padding:15px;
 margin-bottom:15px;
}
.chart{
 width:100%;
 height:450px;
 border:0;
 border-radius:8px;
}
.status{color:#00d9a0}
button{
 background:#00b88a;
 padding:12px 18px;
 border:0;
 border-radius:8px;
}
</style>
</head>

<body>

<header>
<h1>PATIL_TREDE</h1>
<p>Market Learning Dashboard</p>
</header>

<main>

<div class="card">
<h2>Dashboard</h2>
<p class="status">● Online</p>
</div>

<div class="card">
<h2>Bitcoin Chart</h2>

<iframe
class="chart"
src="https://s.tradingview.com/widgetembed/?symbol=BINANCE%3ABTCUSDT&interval=15&theme=dark&style=1&timezone=Asia%2FKolkata&withdateranges=true&hide_side_toolbar=false&allow_symbol_change=true"
loading="lazy"
allowfullscreen>
</iframe>

</div>

<div class="card">
<h2>Broker Information</h2>
<p>Connection Status: Not Connected</p>
</div>

<div class="card">
<h2>Demo Dashboard</h2>
<p>Simulation Only</p>
</div>

<div class="card">
<h2>Contact Support</h2>
<button onclick="alert('PATIL_TREDE Support')">
Contact Support
</button>
</div>

</main>
</body>
</html>
